# Yeo Zi Yi, A0266292X
config:
  target: "http://localhost:6060"
  phases:
    - name: "Warm up"
      duration: 15
      arrivalRate: 5
    - name: "Spike ramp-up"
      duration: 10
      arrivalRate: 10
      rampTo: 80
    - name: "Spike peak"
      duration: 20
      arrivalRate: 80
    - name: "Recovery"
      duration: 30
      arrivalRate: 15
  http:
    timeout: 10
  plugins:
    expect: {}

scenarios:
  - name: "Browse product listing (paginated) — spike"
    weight: 40
    flow:
      - get:
          url: "/api/v1/product/product-count"
          expect:
            - statusCode: 200
      - think: 1
      - get:
          url: "/api/v1/product/product-list/1"
          expect:
            - statusCode: 200
      - think: 1
      - get:
          url: "/api/v1/product/product-list/2"
          expect:
            - statusCode: 200

  - name: "View single product by slug — spike"
    weight: 30
    flow:
      - get:
          url: "/api/v1/product/get-product"
          expect:
            - statusCode: 200
          capture:
            - json: "$.products[0].slug"
              as: "productSlug"
      - think: 1
      - get:
          url: "/api/v1/product/get-product/{{ productSlug }}"
          ifTrue: "productSlug"
          expect:
            - statusCode: 200

  - name: "View product photo — spike"
    weight: 30
    flow:
      - get:
          url: "/api/v1/product/get-product"
          expect:
            - statusCode: 200
          capture:
            - json: "$.products[0]._id"
              as: "productId"
      - think: 1
      - get:
          url: "/api/v1/product/product-photo/{{ productId }}"
          ifTrue: "productId"
          expect:
            - statusCode: 200
